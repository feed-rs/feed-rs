[package]
name = "feed-rs"
version = "3.0.0"
edition = '2024'
authors = ["Mark Pritchard <mpritcha@gmail.com>"]
include = [
    "**/*.rs",
    "Cargo.toml",
    "LICENSE-MIT",
    "README.md",
    "fixture/*"
]
license = "MIT"
homepage = "https://github.com/feed-rs/feed-rs"
repository = "https://github.com/feed-rs/feed-rs.git"
description = "A feed parser that handles Atom, RSS 2.0, RSS 1.0, RSS 0.x and JSON Feed"
keywords = ["rss", "atom", "json", "jsonfeed", "parser"]
categories = ["parser-implementations"]
readme = "README.md"

[badges]
travis-ci = { repository = "feed-rs/feed-rs", branch = "master" }

[dependencies]
ammonia = { version = "4.2.4", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
mediatype = { version = "0.23.0", features = ["serde"] }
quick-xml = { version = "0.42.0", features = ["encoding"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
siphasher = "1.0.4"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
assert-json-diff = "2.0.2"

[features]
sanitize = ["dep:ammonia"]
